document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

xt, hatch stroke */\n  --rule:#D8D8D4;       /* hairlines, dividers, table grid, borders */\n  --sheet:#F2F2F0;      /* page ground, inset wells, zebra rows */\n  --paper:#FFFFFF;      /* the only pure white: raised surfaces, inputs */\n\n  /* ── Semantic aliases ────────────────────────────────────────────── */\n  --text-primary:var(--ink);\n  --text-secondary:var(--graphite);\n  --text-muted:var(--mid);\n  --text-inverse:var(--paper);\n  --text-disabled:var(--mid);\n  --text-link:var(--ink);\n\n  --surface-page:var(--sheet);\n  --surface-card:var(--paper);\n  --surface-well:var(--sheet);\n  --surface-inverse:var(--ink);\n  --surface-hover:var(--sheet);\n  --surface-selected:var(--paper);\n  --surface-drawing:var(--paper);   /* diagram / title-block ground */\n\n  --border-hairline:var(--rule);\n  --border-strong:var(--ink);\n  --border-subtle:var(--rule);\n  --border-focus:var(--ink);\n\n  --icon-default:var(--ink);\n  --icon-secondary:var(--graphite);\n  --icon-disabled:var(--mid);\n\n  /* Status is monochrome by mandate. Differentiation is fill + rule + glyph.\n     These aliases exist so consumers never reach for a hue. */\n  --status-critical-rule:var(--ink);\n  --status-critical-fill:var(--sheet);\n  --status-caution-rule:var(--graphite);\n  --status-caution-fill:var(--sheet);\n  --status-ok-rule:var(--rule);\n  --status-ok-fill:var(--paper);\n  --status-hatch-stroke:var(--mid);\n}\n<\u002Fstyle>\n<style>:root{\n  --font-ui:\"Plus Jakarta Sans\",\"Helvetica Neue\",Arial,sans-serif;\n  --font-mono:\"IBM Plex Mono\",ui-monospace,\"SF Mono\",Menlo,monospace;\n\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n  --weight-bold:700;\n\n  /* Scale. Site floor is 14px; body is 16px. Gloved hands, poor light. */\n  --text-2xs:11px;\n  --text-xs:12px;\n  --text-sm:14px;\n  --text-base:16px;\n  --text-md:18px;\n  --text-lg:22px;\n  --text-xl:28px;\n  --text-2xl:36px;\n  --text-3xl:48px;\n\n  --leading-tight:1.1;\n  --leading-snug:1.25;\n  --leading-normal:1.5;\n  --leading-loose:1.65;\n\n  --tracking-eyebrow:.14em;   /* mono small caps — the house label style */\n  --tracking-mono:.02em;\n  --tracking-display:-.02em;\n  --tracking-normal:0;\n\n  /* Composite roles */\n  --type-display:var(--weight-bold) var(--text-3xl)/var(--leading-tight) var(--font-ui);\n  --type-h1:var(--weight-bold) var(--text-2xl)/var(--leading-tight) var(--font-ui);\n  --type-h2:var(--weight-semibold) var(--text-xl)/var(--leading-snug) var(--font-ui);\n  --type-h3:var(--weight-semibold) var(--text-lg)/var(--leading-snug) var(--font-ui);\n  --type-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--font-ui);\n  --type-body-sm:var(--weight-regular) var(--text-sm)/var(--leading-normal) var(--font-ui);\n  --type-identifier:var(--weight-medium) var(--text-sm)/var(--leading-snug) var(--font-mono);\n  --type-identifier-lg:var(--weight-medium) var(--text-md)/var(--leading-snug) var(--font-mono);\n  --type-eyebrow:var(--weight-semibold) var(--text-xs)/var(--leading-snug) var(--font-mono);\n}\n<\u002Fstyle>\n<style>:root{\n  /* 4px base grid. Generous end of the scale is the default: the interface\n     is used with gloves on. */\n  --space-0:0;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n\n  /* Minimum touch/click target. Never smaller, gloves. */\n  --target-min:44px;\n  --target-lg:56px;\n\n  --control-height-sm:36px;\n  --control-height-md:44px;\n  --control-height-lg:56px;\n  --control-padding-x:var(--space-5);\n\n  --row-height:56px;         /* catalog table row */\n  --row-padding-x:var(--space-4);\n\n  --gutter-page:var(--space-8);\n  --gutter-column:var(--space-6);\n  --sidebar-width:280px;\n  --content-max:1440px;\n}\n<\u002Fstyle>\n<style>:root{\n  /* Zero radius. Everywhere. No exceptions, including avatars and pills. */\n  --radius-none:0;\n  -- ;\n  --tracking-normal:0;\n\n  /* Composite roles */\n  --type-display:var(--weight-bold) var(--text-3xl)/var(--leading-tight) var(--font-ui);\n  --type-h1:var(--weight-bold) var(--text-2xl)/var(--leading-tight) var(--font-ui);\n  --type-h2:var(--weight-semibold) var(--text-xl)/var(--leading-snug) var(--font-ui);\n  --type-h3:var(--weight-semibold) var(--text-lg)/var(--leading-snug) var(--font-ui);\n  --type-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--font-ui);\n  --type-body-sm:var(--weight-regular) var(--text-sm)/var(--leading-normal) var(--font-ui);\n  --type-identifier:var(--weight-medium) var(--text-sm)/var(--leading-snug) var(--font-mono);\n  --type-identifier-lg:var(--weight-medium) var(--text-md)/var(--leading-snug) var(--font-mono);\n  --type-eyebrow:var(--weight-semibold) var(--text-xs)/var(--leading-snug) var(--font-mono);\n}\n\n:root{\n  /* 4px base grid. Generous end of the scale is the default: the interface\n     is used with gloves on. */\n  --space-0:0;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n\n  /* Minimum touch/click target. Never smaller, gloves. */\n  --target-min:44px;\n  --target-lg:56px;\n\n  --control-height-sm:36px;\n  --control-height-md:44px;\n  --control-height-lg:56px;\n  --control-padding-x:var(--space-5);\n\n  --row-height:56px;         /* catalog table row */\n  --row-padding-x:var(--space-4);\n\n  --gutter-page:var(--space-8);\n  --gutter-column:var(--space-6);\n  --sidebar-width:280px;\n  --content-max:1440px;\n}\n\n:root{\n  /* Zero radius. Everywhere. No exceptions, including avatars and pills. */\n  --radius-none:0;\n  --radius:0;\n\n  --hairline:1px;\n  --rule-medium:2px;\n  --rule-heavy:3px;   /* selected-row left rule, warning left rule */\n  --rule-frame:2px;   /* title-block outer frame */\n\n  --border-thin:var(--hairline) solid var(--border-hairline);\n  --border-thick:var(--rule-medium) solid var(--border-strong);\n  --border-frame:var(--rule-frame) solid var(--border-strong);\n\n  /* No shadow system. Elevation is expressed with rules, not blur.\n     A dialog reads as raised because it is framed 2px and the ground\n     behind it is scrimmed — not because it floats. */\n  --shadow-none:none;\n  --scrim:rgba(10,10,10,.55);\n\n  --focus-ring:2px solid var(--ink);\n  --focus-offset:2px;\n}\n\n:root{\n  /* Mechanical, short, linear-ish. Nothing bounces, nothing eases in slowly.\n     Instruments snap. */\n  --duration-instant:0ms; /* @kind other */\n  --duration-fast:80ms; /* @kind other */\n  --duration-base:120ms; /* @kind other */\n  --duration-slow:180ms; /* @kind other */\n  --ease-mechanical:cubic-bezier(.2,0,.4,1); /* @kind other */\n  --ease-linear:linear; /* @kind other */\n  --transition-state:background-color var(--duration-fast) var(--ease-linear),border-color var(--duration-fast) var(--ease-linear),color var(--duration-fast) var(--ease-linear);\n}\n\n:root{\n  /* 45° hatch — the warning / restricted / obsolete fill. Borrowed straight\n     from section-cut hatching on an engineering drawing. */\n  --hatch-45:repeating-linear-gradient(45deg,transparent 0,transparent 5px,var(--status-hatch-stroke) 5px,var(--status-hatch-stroke) 6px);\n  --hatch-45-dense:repeating-linear-gradient(45deg,transparent 0,transparent 3px,var(--status-hatch-stroke) 3px,var(--status-hatch-stroke) 4px);\n  --hatch-135:repeating-linear-gradient(135deg,transparent 0,transparent 5px,var(--status-hatch-stroke) 5px,var(--status-hatch-stroke) 6px);\n\n  /* Drawing grid — the ground for exploded views and diagram panes. */\n  --grid-10:linear-gradient(to right,var(--rule) 0,var(--rule) 1px,transparent 1px,transparent 100%),linear-gradient(to bottom,var(--rule) 0,var(--rule) 1px,transparent 1px,transparent 100%);\n  --grid-size:40px;\n\n  /* Callout square — numbered reference marker on diagrams and steps. */\n  --callout-size:28px;\n  --callout-size-lg:36px;\n}\n\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--surface-page);color:var(--text-primary);font:var(--type-body);-webkit-font-smoothing:antialiased;text-wrap:pretty}\nh1,h2,h3,h4{margin:0;letter-spacing:var(--tracking-display)}\nh1{font:var(--type-h1)}h2{font:var(--type-h2)}h3{font:var(--type-h3)}\np{margin:0 0 var(--space-4)}\na{color:var(--text-link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;transition:var(--transition-state)}\na:hover{text-decoration-thickness:2px}\na:active{background:var(--ink);color:var(--text-inverse);text-decoration:none}\ncode,kbd,samp{font:var(--type-identifier);letter-spacing:var(--tracking-mono)}\nbutton,input,select,textarea{font-family:inherit;font-size:inherit;border-radius:var(--radius-none)}\n:focus-visible{outline:var(--focus-ring);outline-offset:var(--focus-offset)}\n::selection{background:var(--ink);color:var(--text-inverse)}\n::placeholder{color:var(--text-muted)}\nimg{border-radius:var(--radius-none)}\nhr{border:0;border-top:var(--border-thin);margin:var(--space-6) 0}\n.eyebrow{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-secondary)}\n.identifier{font:var(--type-identifier);letter-spacing:var(--tracking-mono)}\n\n<\u002Fstyle>\n<script src=\"ae7d987a-1f9f-46ef-a91c-a2603a373ebf\"><\u002Fscript>\n<style>\n  body{margin:0;background:var(--sheet);font-family:var(--font-ui);color:var(--ink);-webkit-font-smoothing:antialiased}\n  a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px}\n  a:hover{text-decoration-thickness:2px}\n  *{box-sizing:border-box}\n  input,select,button,textarea{font-family:inherit}\n  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:1440px;margin:0 auto;background:var(--sheet);padding:24px 0\">\n<div style=\"display:grid;grid-template-columns:196px minmax(0,1fr);border:1px solid var(--ink);background:var(--paper);min-height:920px;margin:0 24px;width:1392px\">\n\n  <aside style=\"border-right:1px solid var(--ink);display:flex;flex-direction:column\">\n    <div style=\"padding:14px;border-bottom:1px solid var(--rule)\">\n      <b style=\"display:block;font-size:13px;font-weight:600;letter-spacing:.1em\">RUF DIAMOND<\u002Fb>\n      <span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite)\">Catalog admin<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"padding:8px 0;flex:1;display:flex;flex-direction:column\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <button type=\"button\" sc-camel-on-click=\"{{ item.go }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;font-size:13px;text-align:left;color:var(--ink);background:{{ item.bg }};border:none;border-left:3px solid {{ item.rule }};font-weight:{{ item.weight }};cursor:pointer\" style-hover=\"background:var(--sheet)\">\n          <span>{{ item.label }}<\u002Fspan>\n          <sc-if value=\"{{ item.count }}\">\n            <span style=\"font-family:var(--font-mono);font-size:10px;background:var(--ink);color:var(--paper);padding:0 5px\">{{ item.count }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"padding:12px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--graphite);line-height:1.45\">\n      Signed in as {{ operator }}<br>Parts &amp; service\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <div style=\"display:flex;flex-direction:column;min-width:0\">\n\n    <!-- ══ CATALOG ══ -->\n    <sc-if value=\"{{ isCatalog }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;flex:1;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--rule)\">\n          <h2 style=\"font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0\">Catalog<\u002Fh2>\n          <span style=\"margin-left:auto\"><\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ exportCsv }}\" style=\"border:1px solid var(--rule);color:var(--graphite);background:var(--paper);padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"border-color:var(--ink);color:var(--ink)\">Export everything<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ goModel }}\" style=\"border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--graphite)\">Open FT3 Wagon<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:22px;flex:1\">\n          <dl style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:0 0 26px\">\n            <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--paper);padding:15px\">\n                <dt style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);margin-bottom:6px\">{{ s.label }}<\u002Fdt>\n                <dd style=\"margin:0;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em\">{{ s.value }} <small style=\"font-size:12px;font-weight:400;color:var(--graphite);letter-spacing:0\">{{ s.sub }}<\u002Fsmall><\u002Fdd>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdl>\n\n          <sc-for list=\"{{ catalogGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:26px\">\n              <p style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin:0 0 10px\">{{ g.line }}<\u002Fp>\n              <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n                <sc-raw-thead>\n                  <sc-raw-tr>\n                    <sc-raw-th style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Model<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"width:300px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Serial range<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"width:90px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:right;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Figures<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"width:90px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:right;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Parts<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"width:140px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Status<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"width:130px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Last updated<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"width:80px;border-bottom:1px solid var(--ink)\"><\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ g.models }}\" as=\"m\" hint-placeholder-count=\"2\">\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule);font-size:13px;font-weight:{{ m.weight }}\">{{ m.name }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:11px;color:{{ m.metaColor }}\">{{ m.serial }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:{{ m.metaColor }}\">{{ m.figures }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:{{ m.metaColor }}\">{{ m.parts }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule)\">\n                        <span style=\"display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px solid {{ m.chip.border }};border-style:{{ m.chip.style }};background:{{ m.chip.bg }};color:{{ m.chip.fg }}\">{{ m.status }}<\u002Fspan>\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:11px;color:{{ m.metaColor }}\">{{ m.updated }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule);text-align:right\">\n                        <sc-if value=\"{{ m.showAction }}\" hint-placeholder-val=\"{{ true }}\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ m.action }}\" disabled=\"{{ m.disabled }}\" style=\"border:1px solid {{ m.btnBorder }};color:{{ m.btnColor }};background:var(--paper);padding:5px 10px;font-size:12px;font-weight:500;cursor:{{ m.cursor }}\">{{ m.actionLabel }}<\u002Fbutton>\n                        <\u002Fsc-if>\n                      <\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:10px 12px;background:repeating-linear-gradient(45deg,transparent,transparent 4px,var(--sheet) 4px,var(--sheet) 8px);border-left:3px solid var(--ink);max-width:78ch\">\n            <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.1em\">!<\u002Fspan>\n            <span>FT3 Wagon is the pilot import. {{ unmappedTotal }} callouts across 45 figures still have no part attached. Everything else on the Agilis and IronHorse lines is awaiting its first export from the manufacturer.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ MODEL EDITOR ══ -->\n    <sc-if value=\"{{ isModel }}\">\n      <div style=\"display:flex;flex-direction:column;flex:1;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--rule)\">\n          <h2 style=\"font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0\">FT3 Wagon<\u002Fh2>\n          <span style=\"display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px dashed var(--graphite);color:var(--graphite)\">Draft<\u002Fspan>\n          <span style=\"margin-left:auto\"><\u002Fspan>\n          <button type=\"button\" style=\"border:1px solid var(--rule);color:var(--graphite);background:var(--paper);padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"border-color:var(--ink);color:var(--ink)\">Discard changes<\u002Fbutton>\n          <button type=\"button\" style=\"border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--graphite)\">Save<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:22px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px\">\n          <div>\n            <p style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin:0 0 12px\">Identity<\u002Fp>\n            <div style=\"margin-bottom:16px\">\n              <label style=\"display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin-bottom:5px\">Product line<\u002Flabel>\n              <sc-raw-select style=\"width:100%;border:1px solid var(--rule);background:var(--paper);padding:10px 11px;font-size:13px\">\n                <option>Fat Truck<\u002Foption>\n                <option>Agilis<\u002Foption>\n                <option>IronHorse<\u002Foption>\n              <\u002Fsc-raw-select>\n              <p style=\"font-size:12px;color:var(--graphite);margin:5px 0 0\">Product line is a grouping level only. It sets the part-number prefix and the country of manufacture, not the look of the catalog.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"margin-bottom:16px\">\n              <label style=\"display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin-bottom:5px\">Model name<\u002Flabel>\n              <input value=\"{{ modelName }}\" sc-camel-on-change=\"{{ onModelName }}\" style=\"width:100%;border:1px solid var(--rule);background:var(--paper);padding:10px 11px;font-size:13px\">\n            <\u002Fdiv>\n            <div style=\"margin-bottom:16px\">\n              <label style=\"display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin-bottom:5px\">Catalog revision<\u002Flabel>\n              <input value=\"REV A · 2026-07-24\" readonly=\"true\" style=\"width:100%;border:1px solid var(--rule);background:var(--sheet);padding:10px 11px;font-size:13px;font-family:var(--font-mono);color:var(--graphite)\">\n            <\u002Fdiv>\n\n            <p style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin:28px 0 8px\">Serial variants<\u002Fp>\n            <p style=\"font-size:12px;color:var(--graphite);margin:0 0 12px;max-width:56ch\">Split the model only where parts genuinely differ. Customers pick a variant before they see any parts. FT3 Wagon has one.<\u002Fp>\n            <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n              <sc-raw-thead>\n                <sc-raw-tr>\n                  <sc-raw-th style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Label<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"width:80px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:right;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Figures<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"width:50px;border-bottom:1px solid var(--ink)\"><\u002Fsc-raw-th>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr>\n                  <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:12px\">SERIAL NUMBER 99FT3WXXXXXX and up<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:13px;text-align:right\">45<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--rule);text-align:right\">\n                    <button type=\"button\" disabled=\"{{ true }}\" title=\"A model must keep at least one serial variant\" style=\"border:1px solid var(--rule);color:var(--mid);background:var(--sheet);padding:4px 9px;font-size:12px;cursor:not-allowed\">Remove<\u002Fbutton>\n                  <\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <button type=\"button\" style=\"margin-top:12px;border:1px solid var(--rule);color:var(--graphite);background:var(--paper);padding:6px 11px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"border-color:var(--ink);color:var(--ink)\">Add a serial variant<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div>\n            <p style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin:0 0 8px\">Systems<\u002Fp>\n            <p style=\"font-size:12px;color:var(--graphite);margin:0 0 12px;max-width:56ch\">Tick the systems this model carries. Unticking one hides its figures from customers; it does not delete them.<\u002Fp>\n            <div style=\"border:1px solid var(--rule)\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ systemRows }}\" as=\"s\" hint-placeholder-count=\"12\">\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"width:44px;padding:10px 12px;border-bottom:1px solid var(--rule)\">\n                        <input type=\"checkbox\" checked=\"{{ s.on }}\" sc-camel-on-change=\"{{ s.toggle }}\" style=\"width:18px;height:18px;accent-color:#0A0A0A;border-radius:0;cursor:pointer\">\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:10px 4px;border-bottom:1px solid var(--rule);font-size:13px;color:{{ s.nameColor }}\">{{ s.name }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"width:120px;padding:10px 12px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--font-mono);font-size:11px;color:{{ s.metaColor }}\">{{ s.meta }}<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:12px\">\n              <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--graphite)\">{{ systemsOnCount }} of 12 active · {{ activeFigureCount }} figures<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ goFigure }}\" style=\"border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:6px 11px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--graphite)\">Open Filters · FIG 1.1<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ FIGURE EDITOR ══ -->\n    <sc-if value=\"{{ isFigure }}\">\n      <div style=\"display:flex;flex-direction:column;flex:1;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--rule)\">\n          <h2 style=\"font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0\">Filters · FIG 1.1<\u002Fh2>\n          <span style=\"display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px solid {{ figChip.border }};border-style:{{ figChip.style }};background:{{ figChip.bg }};color:{{ figChip.fg }}\">{{ figChipLabel }}<\u002Fspan>\n          <span style=\"margin-left:auto\"><\u002Fspan>\n          <button type=\"button\" style=\"border:1px solid var(--rule);color:var(--graphite);background:var(--paper);padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"border-color:var(--ink);color:var(--ink)\">Replace drawing<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ markComplete }}\" disabled=\"{{ notComplete }}\" title=\"{{ completeTitle }}\" style=\"border:1px solid {{ completeBorder }};background:{{ completeBg }};color:{{ completeFg }};padding:5px 10px;font-size:12px;font-weight:500;cursor:{{ completeCursor }}\">{{ completeLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:22px;flex:1\">\n          <p style=\"font-size:12px;color:var(--graphite);margin:0 0 16px;max-width:88ch\">Select a callout on the drawing, then attach the part it points at. A part may be attached to more than one callout in the same figure — a repeated number is a valid mapping, not an error. Nothing publishes until every callout has a part.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 372px;border:2px solid var(--ink)\">\n            <div style=\"padding:18px;border-right:1px solid var(--rule)\">\n              <div style=\"border:1px solid var(--rule);background-color:var(--paper);background-image:linear-gradient(to right,var(--rule) 1px,transparent 1px),linear-gradient(to bottom,var(--rule) 1px,transparent 1px);background-size:40px 40px\">\n                <svg sc-camel-view-box=\"0 0 560 340\" style=\"width:100%;height:auto;display:block;color:var(--ink)\" role=\"img\" aria-label=\"Filters figure 1.1 drawing with clickable callouts\">\n                  <rect x=\"70\" y=\"176\" width=\"420\" height=\"18\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.6\"><\u002Frect>\n                  <path d=\"M70 194 L86 210 M110 194 L126 210 M150 194 L166 210 M410 194 L426 210 M450 194 L466 210\" stroke=\"var(--mid)\" stroke-width=\"1\"><\u002Fpath>\n                  <rect x=\"100\" y=\"86\" width=\"64\" height=\"90\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Frect>\n                  <ellipse cx=\"132\" cy=\"86\" rx=\"32\" ry=\"9\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fellipse>\n                  <path d=\"M100 108h64M100 154h64\" stroke=\"var(--mid)\" stroke-width=\"1\"><\u002Fpath>\n                  <rect x=\"196\" y=\"106\" width=\"52\" height=\"70\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Frect>\n                  <ellipse cx=\"222\" cy=\"106\" rx=\"26\" ry=\"7\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fellipse>\n                  <path d=\"M196 126h52\" stroke=\"var(--mid)\" stroke-width=\"1\"><\u002Fpath>\n                  <rect x=\"280\" y=\"116\" width=\"44\" height=\"60\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Frect>\n                  <ellipse cx=\"302\" cy=\"116\" rx=\"22\" ry=\"6\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fellipse>\n                  <rect x=\"356\" y=\"96\" width=\"58\" height=\"80\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Frect>\n                  <ellipse cx=\"385\" cy=\"96\" rx=\"29\" ry=\"8\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fellipse>\n                  <path d=\"M356 140h58\" stroke=\"var(--mid)\" stroke-width=\"1\"><\u002Fpath>\n                  <circle cx=\"176\" cy=\"252\" r=\"32\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fcircle>\n                  <circle cx=\"176\" cy=\"252\" r=\"13\" fill=\"none\" stroke=\"var(--mid)\" stroke-width=\"1\"><\u002Fcircle>\n                  <circle cx=\"350\" cy=\"250\" r=\"27\" fill=\"var(--paper)\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fcircle>\n                  <circle cx=\"350\" cy=\"250\" r=\"11\" fill=\"none\" stro px 0 0;font-family:var(--font-mono)\">{{ doneCount }} of 6 mapped<\u002Fp>\n                <div style=\"height:6px;background:var(--rule);margin-top:8px\">\n                  <i style=\"display:block;height:100%;background:var(--ink);width:{{ progressWidth }}\"><\u002Fi>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1\">\n                <sc-for list=\"{{ mapRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                  <div sc-camel-on-click=\"{{ r.select }}\" style=\"display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule);cursor:pointer;background:{{ r.bg }};box-shadow:{{ r.shadow }}\" style-hover=\"background:var(--sheet)\">\n                    <span style=\"font-family:var(--font-mono);font-size:11px;width:24px;height:20px;border:1px solid {{ r.numBorder }};background:{{ r.numBg }};color:{{ r.numFg }};display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px\">{{ r.n }}<\u002Fspan>\n                    <span style=\"flex:1;min-width:0\">\n                      <span style=\"display:block;font-size:12px;color:var(--graphite)\">{{ r.label }}<\u002Fspan>\n                      <span style=\"display:block;font-size:12px;font-family:var(--font-mono);color:{{ r.partColor }};font-style:{{ r.partStyle }}\">{{ r.partText }}<\u002Fspan>\n                      <sc-if value=\"{{ r.repeatNote }}\">\n                        <span style=\"display:block;font-size:11px;font-family:var(--font-mono);color:var(--graphite);margin-top:2px\">{{ r.repeatNote }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fspan>\n                    <sc-if value=\"{{ r.hasPart }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ r.detach }}\" style=\"border:1px solid var(--rule);color:var(--graphite);background:var(--paper);padding:2px 7px;font-size:11px;cursor:pointer;flex:none\" style-hover=\"border-color:var(--ink);color:var(--ink)\" 02Fp>\n                <p style=\"font-size:12px;color:var(--graphite);margin:0\">Expected columns: part no., description, system, figure, qty, unit price CAD, remarks<\u002Fp>\n              <\u002Fdiv>\n              <p style=\"font-size:12px;color:var(--graphite);margin:10px 0 0\">Last import 2026-07-24 · 635 rows · 0 rejected. Rows matching an existing part number update that record; the old values stay in revision history.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;gap:8px;margin-bottom:18px\">\n            <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Part number or description\" style=\"flex:1;min-width:200px;border:1px solid var(--rule);background:var(--paper);padding:10px 11px;font-size:13px\">\n            <sc-raw-select value=\"{{ sysFilter }}\" sc-camel-on-change=\"{{ onSysFilter }}\" style=\"border:1px solid var(--rule);background:var(--paper);padding:10px 11px;font-size:13px;min-width:190px\">\n              <sc-for list=\"{{ sysFilterOptions }}\" as=\"o\" hint-placeholder-count=\"13\">\n                <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <sc-raw-select value=\"{{ stateFilter }}\" sc-camel-on-change=\"{{ onStateFilter }}\" style=\"border:1px solid var(--rule);background:var(--paper);padding:10px 11px;font-size:13px;min-width:170px\">\n              <option value=\"All records\">All records<\u002Foption>\n              <option value=\"Superseded\">Superseded only<\u002Foption>\n              <option value=\"Requires\">Has also-requires<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n\n          <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-raw-th style=\"width:96px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Part no.<\u002Fsc-raw-th>\n                <sc-raw-th style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Description<\u002Fsc-raw-th>\n                <sc-raw-th style=\"width:170px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">System<\u002Fsc-raw-th>\n                <sc-raw-th style=\"width:70px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Figure<\u002Fsc-raw-th>\n                <sc-raw-th style=\"width:56px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:right;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Qty<\u002Fsc-raw-th>\n                <sc-raw-th style=\"width:120px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:right;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Unit price CAD<\u002Fsc-raw-th>\n                <sc-raw-th style=\"width:280px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--ink)\">Remarks<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ partRows }}\" as=\"p\" hint-placeholder-count=\"8\">\n                <sc-raw-tr style=\"background:{{ p.rowBg }}\">\n n { border: 'var(--ink)', style: 'solid', bg: 'var(--ink)', fg: 'var(--paper)' };\n    if (kind === 'draft') return { border: 'var(--graphite)', style: 'dashed', bg: 'var(--paper)', fg: 'var(--graphite)' };\n    if (kind === 'hatch') return { border: 'var(--ink)', style: 'solid', bg: this.HATCH, fg: 'var(--ink)' };\n    return { border: 'var(--rule)', style: 'solid', bg: 'var(--sheet)', fg: 'var(--graphite)' };\n  }\n\n  money(n) {\n    return n.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  }\n\n  go(screen) {\n    return () => this.setState({ screen, rollbackTarget: null });\n  }\n\n  download(name, text) {\n    const url = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));\n    const a = document.createElement('a');\n    a.href = url; a.download = name; a.click();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  }\n\n  mappedCount() {\n    return Object.keys(this.state.map).filter(k => this.state.map[k]).length;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const done = this.mappedCount();\n    const unmappedFig = 6 - done;\n    const unmappedTotal = 116 + unmappedFig;\n\n    const nav = [\n      ['catalog', 'Catalog', null], ['model', 'Models', null], ['figure', 'Figures', null],\n      ['parts', 'Parts', null], ['orders', 'Orders', '5'], ['publish', 'Publishing', null]\n    ].map(([id, label, count]) => ({\n      label, count,\n      go: this.go(id),\n      bg: s.screen === id ? 'var(--sheet)' : 'transparent',\n      rule: s.screen === id ? 'var(--ink)' : 'transparent',\n      weight: s.screen === id ? '600' : '400'\n    }));\n\n    const awaiting = (name) => ({\n      name, serial: 'Awaiting first export', figures: '—', parts: '—',\n      status: 'Awaiting import', updated: '—', chip: this.chip('archived'),\n      metaColor: 'var(--mid)', weight: '400', disabled: true, cursor: 'not-allowed',\n      btnBorder: 'var(--rule)', btnColor: 'var(--mid)', actionLabel: 'Import',\n      action: null, sho n;\n      return {\n        n: c.n, sx: c.sx, sy: c.sy, tx: c.sx + 13, ty: c.sy + 14, leader: c.leader,\n        sqFill: selected ? '#0A0A0A' : '#FFFFFF',\n        sqStroke: selected ? '#0A0A0A' : (m ? '#0A0A0A' : '#9A9A96'),\n        sqDash: m || selected ? 'none' : '3 2',\n        sqText: selected ? '#FFFFFF' : (m ? '#0A0A0A' : '#5A5A58'),\n        select: () => this.setState({ sel: c.n, pickNo: '', pickQty: '1' })\n      };\n    });\n\n    const mapRows = this.CALLOUTS.map(c => {\n      const m = s.map[c.n];\n      const selected = s.sel === c.n;\n      const others = m ? Object.keys(s.map).filter(k => s.map[k] && s.map[k].no === m.no && Number(k) !== c.n) : [];\n      return {\n        n: c.n, label: c.label,\n        hasPart: !!m,\n        partText: m ? m.no + ' · ' + m.desc + (m.qty !== '1' ? '  ×' + m.qty : '') : 'No part attached',\n        partColor: m ? 'var(--ink)' : 'var(--mid)',\n        partStyle: m ? 'normal' : 'italic',\n        repeatNote: others.length ? 'Same part at callout ' + others.join(', ') + ' — permitted' : null,\n        numBorder: m ? 'var(--ink)' : 'var(--graphite)',\n        numBg: m ? 'var(--ink)' : 'var(--paper)',\n        numFg: m ? 'var(--paper)' : 'var(--graphite)',\n        bg: selected ? 'var(--sheet)' : 'var(--paper)',\n        shadow: selected ? 'inset 3px 0 0 var(--ink)' : 'none',\n        select: () => this.setState({ sel: c.n, pickNo: '', pickQty: '1' }),\n        detach: (e) => { e.stopPropagation(); this.setState(st => ({ map: Object.assign({}, st.map, { [c.n]: null }), figComplete: false })); }\n      };\n    });\n\n    const pickerRows = this.PICKER.map(p => {\n      const used = useCount(p.no);\n      const active = s.pickNo === p.no;\n      return {\n        no: p.no, desc: p.desc, price: this.money(p.price),\n        usedNote: used ? 'Attached at ' + used + (used === 1 ? ' callout' : ' callouts') + ' in this figure' : null,\n        bg: active ? 'var(--ink)' : 'var(--paper)',\n        fg: active ? 'var(--paper)' : 'v
