# Local development only. Production primary and normal backups belong in Canada.
# WAL archiving, encrypted off-provider backups, and restore verification are deployment work.
services:
  # Opt-in isolated development/test storage. Bucket creation, private policy,
  # CORS for the exact development origin, and versioning are explicit setup.
  drawing_storage:
    profiles: ["drawing-storage-test"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: local-test-user
      MINIO_ROOT_PASSWORD: local-test-password-only
    ports:
      - "127.0.0.1:19000:9000"
    tmpfs:
      - /data
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rufdiamond
      POSTGRES_USER: rufdiamond
      POSTGRES_PASSWORD: local-development-only
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rufdiamond -d rufdiamond"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
